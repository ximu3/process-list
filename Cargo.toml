[package]
name = "process_list"
version = "0.1.0"
edition = "2021"
authors = ["ximu"]
description = "A lightweight cross-platform library for getting process information"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3.0.0"
napi-derive = "3.0.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_Security"
]}

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
mach2 = "0.4"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
x11 = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
