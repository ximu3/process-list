[package]
name = "process_list"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["ximu"]
description = "Read-only process queries and foreground ownership for Node.js"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["node"]
node = ["dep:napi", "dep:napi-derive"]

[dependencies]
napi = { version = "3.12.2", default-features = false, features = ["napi8"], optional = true }
napi-derive = { version = "3.5", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.175"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.175"
x11rb = { version = "0.14.0", default-features = false }
x11rb-protocol = "0.14.0"

[build-dependencies]
napi-build = "2.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
