name: Verify

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      full:
        description: Always run the complete native matrix
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - id: plan
        env:
          FORCE_FULL: ${{ inputs.full }}
        run: node scripts/ci.mjs plan

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:format .
      - run: pnpm typecheck
      - run: pnpm check:docs
      - run: pnpm test:tooling

  platforms:
    needs: [plan, quality]
    if: needs.plan.outputs.full == 'true'
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/verify-target.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      musl: ${{ matrix.musl }}

  result:
    name: Result
    needs: [plan, quality, platforms]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - env:
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci.mjs result
