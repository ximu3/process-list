name: Verify target

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      target:
        required: true
        type: string
      runner:
        required: true
        type: string
      musl:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: ${{ !inputs.musl }}
        with:
          node-version: '24'
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        if: ${{ !inputs.musl }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        if: ${{ !inputs.musl }}
        with:
          toolchain: '1.90.0'
          components: clippy, rustfmt
          targets: ${{ inputs.target }}
      - if: ${{ !inputs.musl }}
        run: pnpm install --frozen-lockfile
      - if: ${{ !inputs.musl }}
        run: pnpm check:rust-format
      - if: ${{ !inputs.musl }}
        run: pnpm check:rust
      - if: ${{ !inputs.musl }}
        run: pnpm test:rust
      - if: ${{ !inputs.musl }}
        run: pnpm test:hooks
      - name: Build with the Linux baseline toolchain
        if: ${{ !inputs.musl && runner.os == 'Linux' }}
        env:
          NATIVE_TARGET: ${{ inputs.target }}
        run: pnpm exec napi build --platform --release --no-js --output-dir native --dts addon.d.ts --target "$NATIVE_TARGET" --use-napi-cross -- --locked
      - name: Build with the platform SDK
        if: ${{ !inputs.musl && runner.os != 'Linux' }}
        run: pnpm exec napi build --platform --release --no-js --output-dir native --dts addon.d.ts --target ${{ inputs.target }} -- --locked
      - name: Build natively in Alpine
        if: inputs.musl
        run: docker run --rm -e CI=true -v "$PWD:/work" -w /work node:24-alpine node scripts/ci-alpine-build.ts
      - name: Verify generated declarations
        run: git diff --exit-code -- native/addon.d.ts
      - name: Exercise X11 on an isolated display
        if: ${{ !inputs.musl && runner.os == 'Linux' }}
        env:
          PROCESS_LIST_X11_TEST: '1'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth
          xvfb-run -a cargo test --locked --no-default-features x11_window -- --ignored
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ inputs.target }}
          path: native/*.node
          if-no-files-found: error

  runtime:
    needs: build
    name: Node ${{ matrix.node }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24', '26']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: ${{ !inputs.musl }}
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-${{ inputs.target }}
          path: native
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: library
          path: .
      - if: ${{ !inputs.musl }}
        run: npm test
      - if: ${{ !inputs.musl }}
        run: npm run test:package
      - name: Test the same native binary against musl
        if: inputs.musl
        env:
          NODE_VERSION: ${{ matrix.node }}
        run: docker run --rm -e CI=true -v "$PWD:/work" -w /work "node:$NODE_VERSION-alpine" sh -eu -c 'npm test && npm run test:package'
