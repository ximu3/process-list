name: CI
env:
  DEBUG: napi:*
  APP_NAME: process-list
  CARGO_INCREMENTAL: '1'
'on':
  push:
    branches:
      - main
    tags-ignore:
      - '**'
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**
  pull_request: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Oxlint
        run: pnpm lint
      - name: Cargo fmt
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --target x86_64-pc-windows-msvc

  build:
    name: Build windows-x64
    needs:
      - lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          key: x86_64-pc-windows-msvc-cargo-windows-latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build --target x86_64-pc-windows-msvc
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: bindings-x86_64-pc-windows-msvc
          path: |
            ${{ env.APP_NAME }}.*.node
            ${{ env.APP_NAME }}.*.wasm
          if-no-files-found: error

  test-windows-binding:
    name: Test windows binding - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20'
          - '22'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          architecture: x64
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: bindings-x86_64-pc-windows-msvc
          path: .
      - name: List packages
        run: Get-ChildItem -Recurse
      - name: Test bindings
        run: pnpm test

  publish:
    name: Publish
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    needs:
      - test-windows-binding
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          run_install: false
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create package dirs
        run: pnpm exec napi create-npm-dirs
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Move artifacts
        run: pnpm run artifacts
      - name: List packages
        run: ls -R ./npm
        shell: bash
      - name: Publish
        run: |
          COMMIT_SUBJECT="$(git log -1 --pretty=%s)"
          if echo "$COMMIT_SUBJECT" | grep -Eq "^release: v[0-9]+\.[0-9]+\.[0-9]+$";
          then
            RELEASE_TAG="${COMMIT_SUBJECT#release: }"
            HEAD_SHA="$(git rev-parse HEAD)"
            git fetch --tags --force

            if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null;
            then
              TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
              if [ "$TAG_SHA" != "$HEAD_SHA" ];
              then
                echo "Tag ${RELEASE_TAG} already exists on ${TAG_SHA}, but HEAD is ${HEAD_SHA}. Aborting publish."
                exit 1
              fi
              echo "Tag ${RELEASE_TAG} already exists on HEAD, skipping tag creation"
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag "${RELEASE_TAG}"
              git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${RELEASE_TAG}"
            fi

            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
            NPM_CONFIG_PROVENANCE=true pnpm publish --access public --no-git-checks
          else
            echo "Commit message does not match 'release: vX.Y.Z', skipping publish"
          fi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
